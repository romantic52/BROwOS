server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 32k;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; media-src 'self' blob: data:; connect-src 'self' https: http://localhost:* http://127.0.0.1:*; frame-src https: http:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;

    location /api/ {
        proxy_pass http://chromium:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Origin $http_origin;
        proxy_read_timeout 35s;
        proxy_send_timeout 35s;
        proxy_buffering off;
    }

    location = /health {
        proxy_pass http://chromium:3001/health;
        proxy_set_header Origin $http_origin;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
